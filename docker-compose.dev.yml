volumes:
  db_data:
    name: db_data
  storage_data:
    name: storage_data

networks:
  dms:
    name: dms

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    hostname: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - dms
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: 'admin'
      POSTGRES_DB: 'dms'
      TZ: Asia/Tehran

  redis:
    image: redis:8.0-alpine
    container_name: redis
    hostname: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dms

  minio:
    container_name: minio
    hostname: minio
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    entrypoint: sh
    command: -c 'minio server --console-address ":9001" /data/minio'
    restart: always
    volumes:
      - storage_data:/data
    environment:
      MINIO_ROOT_USER: 'admin'
      MINIO_ROOT_PASSWORD: 'sLPHKutd2kXUZv6fthWVUQzcGwL'
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dms
